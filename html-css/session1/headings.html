<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heading Hierarchy</title>
  </head>
  <body>
    <!--
    The heading that should directly follow an <h1> is an <h2>.
    Heading levels should follow a logical hierarchy without skipping
    levels unless there is a valid structural reason.
    Proper heading hierarchy improves accessibility for screen readers
    and helps search engines understand the structure of the page.
    -->

    <h1>My Portfolio</h1>

    <h2>About Me</h2>

    <h2>Skills</h2>

    <h3>JavaScript</h3>

    <h2>Contact</h2>
  </body>
</html>
