<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="css/card.css" />
  </head>
  <body>
    <article class="card">
      <img src="https://placehold.co/320x200" alt="Profile placeholder image" />

      <header class="card-header">
        <h2>Dharshana M</h2>
        <p class="job-title">Computer Science Student</p>
      </header>

      <p class="bio">
        Passionate about web development, software engineering, and learning new
        technologies. I enjoy building projects using HTML, CSS, TypeScript,
        Java, and Python.
      </p>

      <a href="mailto:example@email.com" class="contact-btn"> Contact </a>
    </article>
  </body>
</html>
